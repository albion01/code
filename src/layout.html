<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d5cff'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='38' fill='white'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="/"><span class="brand-mark">A</span>Albion</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/work.html">Work</a></li>
        <li><a href="/projects.html">Projects</a></li>
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/genealogy.html">Genealogy</a></li>
        <li><a href="/about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {{year}} Albion. Built by hand.</p>
      <p class="counter">
        <span class="counter-label">Visitors</span>
        <span id="odometer" class="odometer" aria-label="visitor count" role="img">000000</span>
      </p>
    </div>
  </footer>

  <script>
    (function () {
      var el = document.getElementById("odometer");
      if (!el) return;

      function paint(n) {
        var s = String(n).replace(/\D/g, "");
        while (s.length < 6) s = "0" + s;
        el.textContent = "";
        for (var i = 0; i < s.length; i++) {
          var d = document.createElement("span");
          d.className = "odo-digit";
          d.textContent = s[i];
          el.appendChild(d);
        }
      }

      // Count once per browser session; just read the value after that.
      var counted = sessionStorage.getItem("vc_counted");
      var q = counted ? "?peek=1" : "";

      fetch("/counter.php" + q, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("bad status");
          return r.json();
        })
        .then(function (data) {
          sessionStorage.setItem("vc_counted", "1");
          paint(data.count);
        })
        .catch(function () {
          /* leave the placeholder digits if the endpoint is unavailable */
        });
    })();
  </script>
</body>
</html>
